name: Refresh pathway closures

on:
  schedule:
    # Every 3 hours, 15 min past the hour. The :15 offset gives the City's
    # HYDRA process (which updates the feed every 3h) a head start, and
    # avoids the top-of-hour cron stampede.
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-closures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # calgary_closures_source.py imports `requests`.
        run: pip install requests

      - name: Refresh closures from City of Calgary
        # Exit 0 = success (real closures written, or City genuinely reports zero).
        # Exit 1 = fetch failed; closures.geojson was left untouched and the
        #          run goes red so a human investigates.
        run: python3 Scraping/refresh_closures.py

      - name: Run doctor preflight
        # doctor.py exits 1 on any error-severity failure, which fails the
        # job before we commit a bad file. DATA-002 (staleness warning) is
        # severity=warning and will NOT fail the run.
        run: python3 doctor.py

      - name: Commit and push if closures changed
        run: |
          set -euo pipefail

          if git diff --quiet data/closures.geojson; then
            echo "No change in closures.geojson; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/closures.geojson
          git commit -m "Refresh pathway closures ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push